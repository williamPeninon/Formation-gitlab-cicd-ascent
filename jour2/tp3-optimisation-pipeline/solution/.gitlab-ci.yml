# Pipeline optimisé — voir README.md pour le détail des choix et le gain
# de temps mesuré par rapport à la version de départ (starter/.gitlab-ci.yml).

stages:
  - installation
  - verification
  - tests
  - publication

installer_dependances:
  stage: installation
  image: node:20-alpine
  # taskflow-api n'a aucune dépendance npm : npm ci vérifie la cohérence du
  # package-lock.json mais ne crée pas de node_modules/ (rien à transmettre).
  script:
    - npm ci
    - sleep 5

# Optimisation 1 : ce job ne dépend en réalité que du code source, pas de
# node_modules — needs: le détache du stage "installation" et lui permet de
# démarrer en parallèle dès le début du pipeline.
verification_style_experimental:
  stage: verification
  image: node:20-alpine
  needs: []
  # Optimisation 2 : un job d'analyse "expérimentale" ne doit jamais bloquer
  # tout le pipeline pour un problème de style mineur ou un faux positif.
  allow_failure: true
  script:
    - echo "Analyse de style (expérimentale) en cours..."
    - sleep 15
    - echo "Analyse terminée."

# Optimisation 1 (suite) : job réellement indépendant de installer_dependances,
# détaché lui aussi via needs: [] pour démarrer immédiatement.
verification_licences:
  stage: verification
  image: node:20-alpine
  needs: []
  script:
    - echo "Vérification des licences des dépendances..."
    - sleep 10
    - echo "Aucune licence incompatible détectée."

executer_tests:
  stage: tests
  image: node:20-alpine
  needs:
    - installer_dependances
  script:
    - sleep 20
    # Deux rapports : lisible dans le journal (spec) et JUnit pour GitLab
    - npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=rapport-tests.xml
  artifacts:
    when: always              # conserver le rapport même si un test échoue
    paths:
      - rapport-tests.xml
    reports:
      junit: rapport-tests.xml  # onglet Tests du pipeline + résumé dans la MR
    expire_in: 1 week

# Optimisation 3 : ce job ne s'exécute que si un fichier du dossier docs/ a
# été modifié dans le commit/la MR — inutile de le lancer systématiquement.
# needs: [] lui permet en plus de démarrer sans attendre installer_dependances
# lorsqu'il se déclenche.
tests_documentation:
  stage: tests
  image: node:20-alpine
  needs: []
  rules:
    - changes:
        - docs/**/*
  script:
    - echo "Vérification de la documentation (docs/)..."
    - sleep 8
    - test -f docs/api.md
    - echo "Documentation présente et valide."

notifier_resultat:
  stage: publication
  image: alpine:3.20
  needs:
    - verification_style_experimental
    - executer_tests
  script:
    - echo "Publication du rapport de pipeline..."
    - sleep 5
    - echo "Pipeline terminé."
